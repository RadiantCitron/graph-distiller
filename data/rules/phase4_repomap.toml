# Phase 4 — RepoMap 압축 비율 (agents/repomap.py, ADR-060)
#
# Part 1(핵심 개념 목록)과 Part 2(근거 원문)의 크기를 정하는 값. 챕터를 더 짧게
# 만들고 싶으면 top_fraction을 낮추고, 근거를 더 많이 보여주고 싶으면
# grounding_budget_fraction을 올린다. 바꾼 뒤에는
# `python tests/audit.py audit`로 compression_ratio_pct / core_retention_pct가
# 어떻게 바뀌는지 반드시 확인할 것 — retention이 100%보다 떨어지면 핵심 개념이
# 챕터에서 빠졌다는 뜻이다.

# 챕터 노드 중 PageRank 상위 몇 %를 Part 1에 남길지. 0을 넘고 1.0 이하.
# (작은 챕터는 repomap_small_keep_all_below 이하면 전부 남는다 — 이 값은 .env에 있음)
top_fraction = 0.20

# Part 2가 쓸 수 있는 토큰을, 그 챕터 원문 청크 총 토큰의 몇 %까지로 제한할지.
# 0을 넘고 1.0 이하. 1.0에 가까울수록 원문을 더 많이 보여준다.
grounding_budget_fraction = 0.90

# Part 1+Part 2 합쳐 한 챕터가 쓸 수 있는 최대 토큰 수 (Lost-in-the-Middle 방어).
# ADR-044/W4-B 하드 실링: 80000을 넘는 값은 거부된다(측정 근거 있는 ADR 없이
# 올리는 것 금지) — 낮추는 것은 자유. 정수, 1000 이상 80000 이하.
token_budget = 80000
