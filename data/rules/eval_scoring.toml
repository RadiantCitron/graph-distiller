# E2E 평가 채점 기준 (tests/e2e/run_e2e_eval.py + tests/harness/scoring.py, ADR-060)
#
# LLM 판정 프롬프트 자체는 data/prompts/eval_judge.md에 있다. 여기는 판정 이후
# "숫자를 어떻게 조합·해석할지"만 다룬다 — 다음 루프 목표치 산식, diet_score 가중치,
# 로그/피드백 자르는 길이.

# diet_score = compression_score * compression_weight + information_retention * retention_weight
# 둘 다 1.0이면 동일 가중치(현재 기본값). 압축을 더 중요하게 보고 싶으면
# compression_weight를 올린다.
compression_weight = 1.0
retention_weight = 1.0

# 다음 에이전트 루프가 노려야 할 목표 압축률 = 현재 값 + next_ratio_step_pct,
# next_ratio_cap_pct을 넘지 않는다. retention이 100% 미만이면 목표를 동결한다
# (압축보다 보존 회복이 우선).
next_ratio_step_pct = 2.0
next_ratio_cap_pct = 99.0

# 다음 루프의 핵심 개념 보존율 목표. 100 미만으로 낮추면 "일부 유실 허용"을
# 목표로 삼게 되니 신중히.
next_retention_target_pct = 100.0

# 다음 루프의 information_retention 점수 목표 = 이번 점수 + next_score_step
# (retention이 이미 100%면 목표는 만점 10 고정).
next_score_step = 1

# LLM 판정 자체가 실패했을 때 최대 몇 줄까지 피드백을 남길지.
feedback_max_lines = 3

# 리포트에 함께 실을 output/errors.log 꼬리 줄 수.
error_log_tail_lines = 40

# judge에게 보여줄 RepoMap 텍스트 최대 글자 수 (그 이상은 잘라서 [...truncated...] 표시).
judge_input_max_chars = 40000
