# Phase 2 — 같은 개념(alias) 판정 임계값 (graph/extraction.py::_are_alias_ids, ADR-060)
#
# 두 노드 id가 "표기만 다른 같은 개념"인지 판단하는 기준. 값을 낮추면 서로 다른
# 개념이 잘못 합쳐질 위험이 커지고, 값을 높이면 같은 개념이 안 합쳐질 위험이 커진다.
# 바꾼 뒤에는 반드시 `python tests/audit.py audit`로 병합 결과(노드/엣지 수)가
# 기대한 방향으로 움직였는지 확인할 것.

# 지문(특수문자 제거 후 문자열) 길이가 이보다 짧으면 오탐 위험이 커서 병합 후보에서
# 제외한다. 정수, 1 이상 64 이하.
min_fingerprint_len = 4

# 토큰(띄어쓰기 단위) 개수가 이보다 적은 이름은 서브셋 비교에서 제외한다.
# 정수, 1 이상 64 이하.
min_token_len = 2

# 두 이름의 토큰 집합 Jaccard 유사도가 이 값 이상이어야 같은 개념으로 본다.
# 0.0~1.0. 1.0에 가까울수록 엄격(거의 안 합침), 0에 가까울수록 관대(잘 합침).
jaccard_threshold = 0.8
